<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img"
     aria-labelledby="title description">
  <title id="title">Attach an E-File document to a shipment</title>
  <desc id="description">Sequence diagram showing shipment lookup, construction of the CSFILE reference, and creation of an E-File document.</desc>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#5e5e5e"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #5e5e5e; stroke-width: 2; }
      .line { fill: none; stroke: #5e5e5e; stroke-width: 2; }
      .lifeline { fill: none; stroke: #5e5e5e; stroke-width: 2; stroke-dasharray: 20 10; }
      .message { fill: none; stroke: #5e5e5e; stroke-width: 2; marker-end: url(#arrow); }
      .client { fill: #fc9432; stroke: #5e5e5e; stroke-width: 2; }
      .service { fill: #6db1ff; stroke: #5e5e5e; stroke-width: 2; }
      .activation { fill: #ffffff; stroke: #5e5e5e; stroke-width: 2; }
      .header { fill: #333333; font: 23px Arial, sans-serif; }
      .actor-text { fill: #000000; font: 29px Arial, sans-serif; text-anchor: middle; }
      .label { fill: #333333; font: 22px Arial, sans-serif; }
      .message-text { fill: #333333; font: 21px Arial, sans-serif; text-anchor: middle; }
      .self-message-text { fill: #333333; font: 20px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="frame" x="1" y="1" width="998" height="928" rx="6"/>
  <path class="line" d="M1 34 H890 L902 22 V1"/>
  <text class="header" x="118" y="25">Attach E-File document to shipment (EFile) : EFile</text>

  <line class="lifeline" x1="250" y1="190" x2="250" y2="910"/>
  <line class="lifeline" x1="750" y1="190" x2="750" y2="910"/>

  <rect class="client" x="150" y="70" width="200" height="120" rx="7"/>
  <text class="actor-text" x="250" y="142">Client</text>

  <rect class="service" x="650" y="70" width="200" height="120" rx="7"/>
  <text class="actor-text" x="750" y="127">CargoSoft</text>
  <text class="actor-text" x="750" y="163">API</text>

  <rect class="activation" x="225" y="230" width="50" height="655" rx="6"/>
  <rect class="activation" x="725" y="230" width="50" height="655" rx="6"/>

  <rect class="frame" x="55" y="245" width="890" height="190" rx="7"/>
  <path class="line" d="M55 282 H155 L167 270 V245"/>
  <text class="label" x="92" y="272">opt</text>
  <text class="label" x="76" y="316">[JWT == null]</text>

  <rect class="frame" x="105" y="330" width="790" height="72" rx="7"/>
  <path class="line" d="M105 366 H207 L219 354 V330"/>
  <text class="label" x="143" y="357">ref</text>
  <text class="message-text" x="500" y="386">Retrieve Token (username, password) : JWT</text>

  <line class="message" x1="275" y1="510" x2="725" y2="510"/>
  <text class="message-text" x="500" y="472">post (cargosoft/shipment/lookup)</text>
  <text class="message-text" x="500" y="497">CLIENT + SHIPMENT_NUMBER</text>

  <line class="message" x1="725" y1="590" x2="275" y2="590"/>
  <text class="message-text" x="500" y="620">Response (200 Ok)</text>
  <text class="message-text" x="500" y="646">Shipment[0..*]</text>

  <path class="message" d="M275 675 H390 V720 H275"/>
  <text class="self-message-text" x="410" y="687">Build CSFILE reference</text>
  <text class="self-message-text" x="410" y="714">shipment_number + &quot;#&quot; + client</text>

  <line class="message" x1="275" y1="790" x2="725" y2="790"/>
  <text class="message-text" x="500" y="752">post (cargosoft/efile)</text>
  <text class="message-text" x="500" y="777">Document + CSFILE reference</text>

  <line class="message" x1="725" y1="850" x2="275" y2="850"/>
  <text class="message-text" x="500" y="880">Response (200 Ok)</text>
  <text class="message-text" x="500" y="906">E-File document + id</text>
</svg>
